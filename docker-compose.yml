services:
  pipeline:
    build: .
    command: python -m src.pipeline.run_pipeline
    environment:
      WAREHOUSE_PATH: /app/data/warehouse/settlement.duckdb
      RAW_DIR: /app/data/raw
    volumes:
      - ./data:/app/data

  api:
    build: .
    depends_on:
      pipeline:
        condition: service_completed_successfully
    environment:
      WAREHOUSE_PATH: /app/data/warehouse/settlement.duckdb
      API_KEY: ${API_KEY:-dev-local-key-change-me}
      PII_SALT: ${PII_SALT:-dev-salt-change-me}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  ui:
    image: python:3.12-slim
    command: python -m http.server 8080 --directory /srv
    volumes:
      - ./frontend:/srv:ro
    ports:
      - "8080:8080"
    depends_on:
      - api
