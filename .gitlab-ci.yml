stages:
  - validate
  - test
  - security
  - build
  - package
  - deploy_dev
  - smoke_test
  - deploy_prod

variables:
  PYTHON_IMAGE: python:3.12-slim
  IMAGE: $CI_REGISTRY_IMAGE/settlement-api
  TAG: $CI_COMMIT_SHORT_SHA
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  KPI_START: "2026-09-01"
  KPI_END: "2026-09-07"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      files: [requirements-dev.txt]
    paths: [.cache/pip]
    policy: pull-push
  before_script:
    - pip install --quiet -r requirements-dev.txt

.main_only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.aws:
  image: $PYTHON_IMAGE
  before_script:
    - pip install --quiet awscli httpx

.aws_configured:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AWS_ACCOUNT_ID

lint:
  stage: validate
  extends: .python
  script:
    - ruff check src tests scripts deploy incident
    - python -m compileall -q src scripts deploy incident

test_gate:
  stage: test
  extends: .python
  needs: [lint]
  script:
    - python scripts/generate_sample_data.py
    - python -m src.pipeline.run_pipeline
    - python -m scripts.run_test_gate --out evidence/01_test_results
    - python -m scripts.reconciliation_gate --out evidence/09_kpi_reconciliation/ci_warehouse.json
  artifacts:
    when: always
    expire_in: 90 days
    paths: [evidence/01_test_results/, evidence/09_kpi_reconciliation/]
    reports:
      junit: evidence/01_test_results/junit_*.xml

.security_job:
  stage: security
  extends: .python
  needs: [lint]
  artifacts:
    when: always
    expire_in: 90 days
    paths: [evidence/02_security_results/]

sast:
  extends: .security_job
  script:
    - python -m scripts.security_gate --checks sast --out evidence/02_security_results

secret_scan:
  extends: .security_job
  script:
    - python -m scripts.security_gate --checks secrets --out evidence/02_security_results

sca:
  extends: .security_job
  script:
    - python -m scripts.security_gate --checks sca --out evidence/02_security_results

build_image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [test_gate, sast, secret_scan, sca]
  rules:
    - !reference [.main_only, rules]
    - if: $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --label "built-by=gitlab-ci" -t "$IMAGE:$TAG" .
    - docker push "$IMAGE:$TAG"
    - mkdir -p evidence/05_docker_image
    - docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | tee evidence/05_docker_image/image_digest.txt
  artifacts:
    paths: [evidence/05_docker_image/]

container_scan:
  stage: package
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  needs: [build_image]
  rules:
    - !reference [.main_only, rules]
    - if: $CI_COMMIT_TAG
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - mkdir -p evidence/02_security_results
    - trivy image --format json --output evidence/02_security_results/container.json --severity HIGH,CRITICAL "$IMAGE:$TAG"
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE:$TAG"
  artifacts:
    when: always
    paths: [evidence/02_security_results/container.json]

release_manifest:
  stage: package
  image: $PYTHON_IMAGE
  needs: [container_scan, build_image]
  rules:
    - !reference [.main_only, rules]
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p evidence/06_deployment_version
    - |
      cat > evidence/06_deployment_version/release_manifest.json <<JSON
      {"image": "$IMAGE:$TAG", "digest": "$(cat evidence/05_docker_image/image_digest.txt)",
       "commit": "$CI_COMMIT_SHA", "pipeline": "$CI_PIPELINE_URL", "built_by": "gitlab-ci"}
      JSON
  artifacts:
    paths: [evidence/06_deployment_version/]

bluegreen_rehearsal:
  stage: smoke_test
  extends: .python
  needs: [test_gate]
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    BLUEGREEN_HOST: docker
    BIND_ADDR: "0.0.0.0"
  before_script:
    - pip install --quiet -r requirements-dev.txt
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates > /dev/null
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
    - mkdir -p /usr/local/lib/docker/cli-plugins
    - curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64
    - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
    - docker version --format 'docker {{.Server.Version}}' && docker compose version
  script:
    - python scripts/generate_sample_data.py
    - python -m src.pipeline.run_pipeline
    - python -m scripts.run_drill --inject A
  artifacts:
    when: always
    expire_in: 90 days
    paths: [evidence/, deploy/logs/]

deploy_dev:
  stage: deploy_dev
  extends: .aws
  needs: [release_manifest]
  rules:
    - !reference [.aws_configured, rules]
  environment:
    name: dev
    url: $DEV_API_URL
  script:
    - python scripts/render_task_def.py --image "$IMAGE:$TAG" --env dev > taskdef.json
    - aws ecs register-task-definition --cli-input-json file://taskdef.json
    - aws ecs update-service --cluster settlement-dev --service settlement-api --task-definition settlement-api-dev --force-new-deployment
    - aws ecs wait services-stable --cluster settlement-dev --services settlement-api

smoke_test_dev:
  stage: smoke_test
  extends: .aws
  needs: [deploy_dev]
  rules:
    - !reference [.aws_configured, rules]
  script:
    - python -m scripts.smoke_test --base-url "$DEV_API_URL" --api-key "$DEV_SMOKE_API_KEY" --start "$KPI_START" --end "$KPI_END" --out evidence/08_smoke_test_results/dev.json
  artifacts:
    when: always
    paths: [evidence/08_smoke_test_results/]

deploy_prod_green:
  stage: deploy_prod
  extends: .aws
  needs: [smoke_test_dev, release_manifest]
  rules:
    - if: $CI_COMMIT_TAG && $AWS_ACCOUNT_ID
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AWS_ACCOUNT_ID
      when: manual
  allow_failure: false
  environment:
    name: production
    url: $PROD_API_URL
    action: prepare
  resource_group: production
  script:
    - LIVE=$(aws ssm get-parameter --name /settlement/prod/live_color --query Parameter.Value --output text)
    - IDLE=$([ "$LIVE" = "blue" ] && echo green || echo blue)
    - printf "live=%s\nidle=%s\n" "$LIVE" "$IDLE" | tee deploy_colors.env
    - python -m scripts.smoke_test --base-url "$PROD_API_URL" --api-key "$PROD_SMOKE_API_KEY" --start "$KPI_START" --end "$KPI_END" --save-as-baseline evidence/09_kpi_reconciliation/baseline_kpis.json --out evidence/08_smoke_test_results/prod_live_before.json
    - python scripts/render_task_def.py --image "$IMAGE:$TAG" --env prod > taskdef.json
    - aws ecs register-task-definition --cli-input-json file://taskdef.json
    - aws ecs update-service --cluster settlement-prod --service "settlement-api-$IDLE" --task-definition settlement-api-prod --force-new-deployment
    - aws ecs wait services-stable --cluster settlement-prod --services "settlement-api-$IDLE"
    - IDLE_URL=$([ "$IDLE" = "blue" ] && echo "$PROD_BLUE_TEST_URL" || echo "$PROD_GREEN_TEST_URL")
    - python -m scripts.smoke_test --base-url "$IDLE_URL" --api-key "$PROD_SMOKE_API_KEY" --start "$KPI_START" --end "$KPI_END" --expected evidence/09_kpi_reconciliation/baseline_kpis.json --out evidence/08_smoke_test_results/prod_idle_precheck.json
  artifacts:
    when: always
    reports:
      dotenv: deploy_colors.env
    paths: [evidence/08_smoke_test_results/, evidence/09_kpi_reconciliation/]

cutover_prod:
  stage: deploy_prod
  extends: .aws
  needs: [deploy_prod_green]
  rules:
    - if: $CI_COMMIT_TAG && $AWS_ACCOUNT_ID
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AWS_ACCOUNT_ID
      when: manual
  environment:
    name: production
    url: $PROD_API_URL
  resource_group: production
  script:
    - IDLE_TG=$([ "$idle" = "blue" ] && echo "$PROD_BLUE_TG_ARN" || echo "$PROD_GREEN_TG_ARN")
    - aws elbv2 modify-listener --listener-arn "$PROD_LISTENER_ARN" --default-actions Type=forward,TargetGroupArn="$IDLE_TG"
    - aws ssm put-parameter --name /settlement/prod/live_color --value "$idle" --type String --overwrite
    - mkdir -p evidence/07_blue_green_status
    - echo "$(date -u +%FT%TZ) cutover $live -> $idle image=$IMAGE:$TAG" | tee -a evidence/07_blue_green_status/cutover.log
    - python -m scripts.smoke_test --base-url "$PROD_API_URL" --api-key "$PROD_SMOKE_API_KEY" --start "$KPI_START" --end "$KPI_END" --expected evidence/09_kpi_reconciliation/baseline_kpis.json --out evidence/08_smoke_test_results/prod_after_cutover.json
  artifacts:
    when: always
    paths: [evidence/07_blue_green_status/, evidence/08_smoke_test_results/]

rollback_prod:
  stage: deploy_prod
  extends: .aws
  needs: [deploy_prod_green]
  rules:
    - if: $CI_COMMIT_TAG && $AWS_ACCOUNT_ID
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AWS_ACCOUNT_ID
      when: manual
  environment:
    name: production
    url: $PROD_API_URL
  resource_group: production
  script:
    - LIVE_TG=$([ "$live" = "blue" ] && echo "$PROD_BLUE_TG_ARN" || echo "$PROD_GREEN_TG_ARN")
    - aws elbv2 modify-listener --listener-arn "$PROD_LISTENER_ARN" --default-actions Type=forward,TargetGroupArn="$LIVE_TG"
    - aws ssm put-parameter --name /settlement/prod/live_color --value "$live" --type String --overwrite
    - mkdir -p evidence/07_blue_green_status
    - echo "$(date -u +%FT%TZ) rollback -> $live" | tee -a evidence/07_blue_green_status/rollback.log
    - python -m scripts.smoke_test --base-url "$PROD_API_URL" --api-key "$PROD_SMOKE_API_KEY" --start "$KPI_START" --end "$KPI_END" --expected evidence/09_kpi_reconciliation/baseline_kpis.json --out evidence/08_smoke_test_results/prod_after_rollback.json
  artifacts:
    when: always
    paths: [evidence/07_blue_green_status/, evidence/08_smoke_test_results/]
