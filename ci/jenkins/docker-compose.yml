services:
  jenkins:
    build: .
    container_name: bny-jenkins
    user: root
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      JAVA_OPTS: "-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/repo:ro

volumes:
  jenkins_home:
